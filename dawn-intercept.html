<title>새벽 요격대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: one full-height stage; a 2:3 game canvas centered in it, with HTML overlays for menu, pause and results.
   Single dark look by choice: a pre-dawn sky over the battlefield. */
:root{
  --night:#14122b;
  --dusk:#3b2a5c;
  --ember:#ff8a4c;
  --ivory:#f6efe3;
  --steel:#a9b4d6;
  --mint:#6fe3b5;
  --alert:#ff4d6d;
  --veil:rgba(20,18,43,.78);
  --font-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ivory);font-family:var(--font-body);
  overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding-block:12px;box-sizing:border-box}
.frame{position:relative;container-type:size;border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(246,239,227,.08),0 30px 80px rgba(0,0,0,.5);background:var(--dusk)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2.6cqh,22px);
  padding:7cqw;box-sizing:border-box;background:linear-gradient(180deg,var(--veil),rgba(59,42,92,.55) 70%,rgba(255,138,76,.18));
  overflow-y:auto;text-align:left}
.eyebrow{margin:0;font-family:var(--font-mono);font-size:clamp(10px,2.6cqw,13px);letter-spacing:.14em;color:var(--ember);text-transform:uppercase}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;line-height:.95;text-wrap:balance}
h1{font-size:19cqw;letter-spacing:-.01em}
h1 span{color:var(--ember)}
h2{font-size:12cqw}
.lede{margin:0;font-size:clamp(12px,3.4cqw,16px);line-height:1.6;color:var(--steel);max-width:34em}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:clamp(11px,3.1cqw,15px)}
.keys dt{font-family:var(--font-mono);color:var(--ivory);font-weight:700}
.keys dd{margin:0;color:var(--steel)}
.items{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0;padding:0;list-style:none;font-size:clamp(11px,3cqw,14px);color:var(--steel)}
.items li{display:flex;align-items:center;gap:6px}
.chip{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:5px;font-family:var(--font-mono);font-weight:700;color:var(--night);font-size:.9em}
.chip.p{background:var(--ember)}.chip.h{background:var(--mint)}.chip.b{background:#b9a6ff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border:0}
.go{font-family:var(--font-display);font-size:clamp(18px,6cqw,28px);padding:.45em 1.3em;border-radius:6px;background:var(--ember);color:var(--night);
  box-shadow:0 6px 0 #b8543a;transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b8543a}
.ghost{font-size:clamp(12px,3.2cqw,15px);padding:.55em 1em;border-radius:6px;background:transparent;color:var(--steel);box-shadow:inset 0 0 0 1px rgba(169,180,214,.4)}
.ghost:hover{color:var(--ivory)}
button:focus-visible{outline:3px solid var(--ivory);outline-offset:3px}
.best{margin:0;font-family:var(--font-mono);font-size:clamp(11px,3cqw,14px);color:var(--steel)}
.best b{color:var(--ivory)}
.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.result div{display:flex;flex-direction:column;gap:2px}
.result dt{font-size:clamp(10px,2.8cqw,13px);color:var(--steel)}
.result dd{margin:0;font-family:var(--font-mono);font-weight:700;font-size:clamp(16px,6cqw,28px);font-variant-numeric:tabular-nums}
.newbest{margin:0;color:var(--mint);font-weight:700}
.hudbtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:36px;height:36px;border-radius:6px;
  background:rgba(20,18,43,.5);color:var(--ivory);font-family:var(--font-mono);font-weight:700;box-shadow:inset 0 0 0 1px rgba(246,239,227,.25)}
.bomb{position:absolute;right:14px;bottom:52px;width:64px;height:64px;border-radius:50%;display:none;place-items:center;
  background:rgba(185,166,255,.22);color:var(--ivory);font-weight:700;box-shadow:inset 0 0 0 2px #b9a6ff;font-size:14px}
@media (pointer:coarse){.bomb{display:grid}}
</style>

<main class="stage" id="stage">
  <div class="frame" id="frame">
    <canvas id="game" aria-label="게임 화면"></canvas>

    <section class="overlay" id="menu">
      <p class="eyebrow">제7 요격비행대 · 05:12 출격</p>
      <h1>새벽<br><span>요격대</span></h1>
      <p class="lede">해가 뜨기 전에 몰려오는 적 편대를 막아내세요. 네 번째 구역마다 적 기함이 나타납니다.</p>
      <dl class="keys">
        <dt>방향키 · WASD</dt><dd>이동 (터치는 화면을 끌기)</dd>
        <dt>자동</dt><dd>기총 사격</dd>
        <dt>Space · X</dt><dd>폭탄: 화면의 적탄을 모두 지움</dd>
        <dt>Esc · P</dt><dd>일시정지 · M 소리</dd>
      </dl>
      <ul class="items">
        <li><span class="chip p">P</span>화력 강화</li>
        <li><span class="chip h">H</span>기체 수리</li>
        <li><span class="chip b">B</span>폭탄 +1</li>
      </ul>
      <div class="row">
        <button class="go" id="startBtn">출격</button>
        <button class="ghost mute" id="muteMenu">소리 켜짐</button>
      </div>
      <p class="best">최고 점수 <b id="bestMenu">0</b></p>
    </section>

    <section class="overlay" id="pause" hidden>
      <p class="eyebrow">작전 일시정지</p>
      <h2>잠시 대기</h2>
      <div class="row">
        <button class="go" id="resumeBtn">계속</button>
        <button class="ghost mute" id="mutePause">소리 켜짐</button>
        <button class="ghost" id="quitBtn">처음으로</button>
      </div>
    </section>

    <section class="overlay" id="over" hidden>
      <p class="eyebrow">작전 종료</p>
      <h2>격추당했습니다</h2>
      <dl class="result">
        <div><dt>점수</dt><dd id="rScore">0</dd></div>
        <div><dt>도달 구역</dt><dd id="rWave">1</dd></div>
        <div><dt>최고</dt><dd id="rBest">0</dd></div>
      </dl>
      <p class="newbest" id="newBest" hidden>새 최고 기록입니다.</p>
      <div class="row">
        <button class="go" id="againBtn">다시 출격</button>
        <button class="ghost" id="homeBtn">처음으로</button>
      </div>
    </section>

    <button class="hudbtn" id="pauseBtn" hidden aria-label="일시정지">II</button>
    <button class="bomb" id="bombBtn" hidden aria-label="폭탄 사용">폭탄</button>
  </div>
</main>

<script>
(() => {
const W = 480, H = 720, TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), cv = $('game'), ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = {
  night:'#14122b', dusk:'#3b2a5c', ember:'#ff8a4c', ivory:'#f6efe3', steel:'#a9b4d6',
  mint:'#6fe3b5', alert:'#ff4d6d', violet:'#b9a6ff', red:'#c8324e', redDark:'#5a1630'
};

/* ---------- sizing ---------- */
let frameW = 400;
function fit(){
  const aw = stage.clientWidth, ah = stage.clientHeight - 24;
  const w = Math.max(200, Math.floor(Math.min(aw, ah * 2 / 3)));
  frameW = w;
  frame.style.width = w + 'px';
  frame.style.height = Math.round(w * 1.5) + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * 1.5 * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
new ResizeObserver(fit).observe(stage);
fit();

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const fmt = n => Math.floor(n).toLocaleString('ko-KR');
function poly(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }

/* ---------- audio ---------- */
let ac = null, muted = false, noiseBuf = null;
function initAudio(){
  if (ac) { ac.resume && ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function tone(f, d, type = 'square', v = 0.04, f2){
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
}
function boom(big){
  if (!ac || muted || !noiseBuf) return;
  const t = ac.currentTime, d = big ? 0.9 : 0.3;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(big ? 900 : 1600, t);
  lp.frequency.exponentialRampToValueAtTime(120, t + d);
  const g = ac.createGain(); g.gain.setValueAtTime(big ? 0.4 : 0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(lp).connect(g).connect(ac.destination); s.start(t); s.stop(t + d);
}
function setMute(m){
  muted = m;
  document.querySelectorAll('.mute').forEach(b => b.textContent = muted ? '소리 꺼짐' : '소리 켜짐');
}

/* ---------- storage ---------- */
let hi = 0;
try { hi = +localStorage.getItem('dawn-intercept-hi') || 0; } catch (e) {}
$('bestMenu').textContent = fmt(hi);

/* ---------- background ---------- */
let sky = null;
const stars = Array.from({length: 60}, () => ({x: rand(0, W), y: rand(0, H * 0.6), r: rand(0.4, 1.4), p: rand(0, TAU)}));
const clouds = Array.from({length: 14}, (_, i) => makeCloud(rand(-100, H)));
function makeCloud(y){
  const near = Math.random() < 0.35;
  return {x: rand(-40, W + 40), y, w: near ? rand(110, 180) : rand(60, 110), spd: near ? rand(140, 190) : rand(40, 80), near, a: near ? rand(.16, .26) : rand(.18, .32)};
}
function updateBg(dt){
  for (const c of clouds) { c.y += c.spd * dt; if (c.y > H + 80) Object.assign(c, makeCloud(-80)); }
}
function drawBg(){
  if (!sky) {
    sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#14122b'); sky.addColorStop(.5, '#2e2550'); sky.addColorStop(.82, '#6a3a62'); sky.addColorStop(1, '#a8544f');
  }
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = (0.35 + 0.35 * Math.sin(time * 1.5 + s.p)) * (1 - s.y / (H * 0.6));
    ctx.fillStyle = C.ivory; circle(s.x, s.y, s.r);
  }
  for (const c of clouds) {
    ctx.globalAlpha = c.a;
    ctx.fillStyle = c.near ? '#f3c9b8' : '#8a6aa0';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w * .5, c.w * .16, 0, 0, TAU);
    ctx.ellipse(c.x - c.w * .2, c.y - c.w * .07, c.w * .25, c.w * .13, 0, 0, TAU);
    ctx.ellipse(c.x + c.w * .18, c.y - c.w * .05, c.w * .22, c.w * .12, 0, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- game state ---------- */
let state = 'menu', time = 0;
let P, pB, eB, en, parts, picks, texts, score, wave, waveT, spawnT, boss, shake, flash, hurtFlash, dieT, banner, shotN;
const keys = {};
let drag = null;

function reset(){
  P = {x: W / 2, y: H - 110, r: 5, hp: 5, max: 5, lvl: 1, bombs: 2, inv: 2, cd: 0, vx: 0};
  pB = []; eB = []; en = []; parts = []; picks = []; texts = [];
  score = 0; wave = 1; waveT = 0; spawnT = 1.2; boss = null;
  shake = 0; flash = 0; hurtFlash = 0; dieT = 0; shotN = 0;
  showBanner('구역 1', '적 정찰 편대 접근');
}
function showBanner(text, sub, warn = false){ banner = {text, sub, t: 0, dur: 2.4, warn}; }
const bulletSpeed = () => Math.min(1.6, 1 + (wave - 1) * 0.05);
const aim = (x, y) => Math.atan2(P.y - y, P.x - x);
function eShoot(x, y, ang, spd, r = 5){ eB.push({x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r}); }

/* ---------- enemies ---------- */
const TYPES = {
  scout:  {hp: 2,  r: 14, score: 100},
  gunner: {hp: 6,  r: 18, score: 250},
  heavy:  {hp: 24, r: 30, score: 800},
  diver:  {hp: 3,  r: 13, score: 200},
};
function spawnEnemy(type, x, y, opt = {}){
  const b = TYPES[type];
  en.push(Object.assign({type, x, y, hp: Math.ceil(b.hp * (1 + (wave - 1) * 0.12)), r: b.r, score: b.score, t: 0, flash: 0, fire: rand(0.8, 1.8)}, opt));
}
function spawnPattern(){
  const r = Math.random();
  if (wave >= 3 && r < 0.14) {
    spawnEnemy('heavy', rand(90, W - 90), -50);
  } else if (r < 0.45 || wave === 1 && r > 0.7) {
    const n = 4 + Math.min(4, wave >> 1), x = rand(90, W - 90), amp = rand(30, 90), ph = rand(0, TAU);
    for (let i = 0; i < n; i++) spawnEnemy('scout', x, -30 - i * 34, {x0: x, amp, ph: ph + i * 0.45});
  } else if (r < 0.7) {
    const n = wave >= 5 ? 3 : 2;
    for (let i = 0; i < n; i++) spawnEnemy('gunner', rand(50, W - 50), -30 - i * 40, {ty: rand(80, 260), dir: Math.random() < .5 ? -1 : 1});
  } else {
    const n = Math.min(5, 2 + (wave >> 2));
    for (let i = 0; i < n; i++) spawnEnemy('diver', 60 + (W - 120) * (i + .5) / n + rand(-20, 20), -20, {ty: rand(60, 160), ph: 0, ang: Math.PI / 2});
  }
}
function spawnBoss(){
  const hp = 260 + wave * 50;
  boss = {type: 'boss', x: W / 2, y: -100, hp, maxHp: hp, r: 52, t: 0, pat: 0, patT: 0, fire: 1, spin: 0, burst: 0, flash: 0, score: 5000 + wave * 500};
  en.push(boss);
  showBanner('경고', '적 기함 접근', true);
  tone(440, .5, 'sawtooth', .05, 220); setTimeout(() => tone(440, .5, 'sawtooth', .05, 220), 600);
}
function nextWave(){
  wave++; waveT = 0; spawnT = 2;
  if (wave % 4 === 0) spawnBoss();
  else showBanner('구역 ' + wave, wave % 4 === 3 ? '다음 구역에 기함이 있습니다' : '적 편대 증강');
}
function updEnemy(e, dt){
  const bs = bulletSpeed();
  switch (e.type) {
    case 'scout':
      e.y += 150 * dt; e.x = e.x0 + Math.sin(e.t * 2.6 + e.ph) * e.amp;
      if (wave >= 3) { e.fire -= dt; if (e.fire <= 0 && e.y > 0 && e.y < H * .6) { e.fire = rand(2.5, 4.5); eShoot(e.x, e.y, aim(e.x, e.y), 150 * bs); } }
      break;
    case 'gunner':
      if (e.y < e.ty) e.y += 140 * dt;
      else if (e.t < 9) { e.x += e.dir * 70 * dt; if (e.x < 30 || e.x > W - 30) e.dir *= -1; }
      else e.y += 120 * dt;
      e.fire -= dt;
      if (e.fire <= 0 && e.y > 10) {
        e.fire = rand(1.3, 2.1);
        const a = aim(e.x, e.y + 10);
        if (wave >= 4) for (const o of [-.18, 0, .18]) eShoot(e.x, e.y + 10, a + o, 190 * bs);
        else eShoot(e.x, e.y + 10, a, 190 * bs);
        tone(320, .06, 'square', .012);
      }
      break;
    case 'heavy':
      e.y += 42 * dt; e.fire -= dt;
      if (e.fire <= 0 && e.y > 20) {
        e.fire = 2.1;
        const n = wave >= 7 ? 7 : 5;
        for (let i = 0; i < n; i++) eShoot(e.x, e.y + 24, Math.PI / 2 + (i - (n - 1) / 2) * 0.2, 150 * bs, 6);
      }
      break;
    case 'diver':
      if (e.ph === 0) {
        e.y += (e.ty - e.y) * 3 * dt; e.ang = aim(e.x, e.y);
        if (e.t > 0.9) { e.ph = 1; e.vx = Math.cos(e.ang) * 400; e.vy = Math.sin(e.ang) * 400; tone(700, .25, 'sawtooth', .015, 200); }
      } else { e.x += e.vx * dt; e.y += e.vy * dt; }
      break;
    case 'boss': updBoss(e, dt); break;
  }
  if (e.type !== 'boss' && (e.y > H + 60 || e.x < -80 || e.x > W + 80 || e.y < -260)) e.gone = true;
}
function updBoss(e, dt){
  const bs = bulletSpeed();
  if (e.y < 130) { e.y += 60 * dt; return; }
  e.x = W / 2 + Math.sin(e.t * 0.5) * 130;
  e.patT += dt; if (e.patT > 5) { e.patT = 0; e.pat = (e.pat + 1) % 3; e.fire = 0.6; }
  e.fire -= dt;
  const rage = e.hp < e.maxHp / 2;
  if (e.fire > 0) return;
  if (e.pat === 0) {
    e.fire = rage ? 0.9 : 1.2;
    const n = rage ? 22 : 16, off = rand(0, TAU);
    for (let i = 0; i < n; i++) eShoot(e.x, e.y + 10, off + i / n * TAU, 140 * bs);
    tone(180, .2, 'triangle', .04, 90);
  } else if (e.pat === 1) {
    e.fire = 0.15; e.burst++;
    if (e.burst % 7 < 4) for (const dx of [-36, 36]) eShoot(e.x + dx, e.y + 22, aim(e.x + dx, e.y + 22), 240 * bs);
  } else {
    e.fire = 0.09; e.spin += 0.3;
    const k = rage ? 3 : 2;
    for (let j = 0; j < k; j++) eShoot(e.x, e.y + 16, e.spin + j * TAU / k, 160 * bs);
  }
}
function hit(e, dmg){
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.06;
  if (e.hp <= 0) kill(e);
}
function kill(e){
  e.dead = true; score += e.score;
  texts.push({x: e.x, y: e.y, txt: '+' + fmt(e.score), t: 0});
  if (e.type === 'boss') {
    for (let i = 0; i < 6; i++) explode(e.x + rand(-80, 80), e.y + rand(-30, 30), 30, 260);
    explode(e.x, e.y, 90, 380);
    shake = 1.2; flash = 0.6; boom(true);
    drop(e.x - 40, e.y, 'P'); drop(e.x, e.y, 'H'); drop(e.x + 40, e.y, 'B');
    boss = null;
    nextWave();
    showBanner('기함 격추', '구역 ' + wave + '로 전진');
    return;
  }
  const heavy = e.type === 'heavy';
  explode(e.x, e.y, heavy ? 50 : 18, heavy ? 240 : 160);
  boom(heavy);
  shake = Math.max(shake, heavy ? 0.4 : 0.1);
  if (heavy || Math.random() < 0.07) drop(e.x, e.y);
}
function drop(x, y, type){
  if (!type) {
    const r = Math.random();
    type = (P.lvl < 4 && r < 0.5) ? 'P' : (P.hp < P.max && r < 0.8) ? 'H' : 'B';
  }
  picks.push({x, y, type, t: 0, vx: rand(-30, 30)});
}
function explode(x, y, n, spd){
  const cols = ['#fff3d6', '#ffd08a', C.ember, C.alert];
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(0.2, 1) * spd, life = rand(.3, .9);
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size: rand(1.5, 4.5), col: cols[i % 4]});
  }
}
function spark(x, y){
  for (let i = 0; i < 3; i++) { const a = rand(-2.6, -0.5), life = rand(.1, .25); parts.push({x, y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, life, max: life, size: 1.5, col: C.ivory}); }
}

/* ---------- player ---------- */
function fire(){
  const x = P.x, y = P.y - 18;
  const add = (dx, a) => pB.push({x: x + dx, y, vx: Math.sin(a) * 760, vy: -Math.cos(a) * 760, dmg: 1});
  switch (P.lvl) {
    case 1: add(0, 0); break;
    case 2: add(-7, 0); add(7, 0); break;
    case 3: add(0, 0); add(-8, -.12); add(8, .12); break;
    default: add(-6, 0); add(6, 0); add(-10, -.14); add(10, .14); add(-12, -.28); add(12, .28);
  }
  if (++shotN % 2 === 0) tone(1200, .03, 'square', .006, 600);
}
function hurt(){
  if (P.inv > 0 || state !== 'play') return;
  P.hp--; P.inv = 1.6; shake = 0.6; hurtFlash = 0.35;
  if (P.lvl > 1) P.lvl--;
  explode(P.x, P.y, 24, 200); boom(false);
  if (P.hp <= 0) {
    explode(P.x, P.y, 80, 320); boom(true); shake = 1;
    state = 'dying'; dieT = 1.4; setHud(false);
  }
}
function useBomb(){
  if (state !== 'play' || P.bombs <= 0) return;
  P.bombs--; flash = 0.5; shake = 0.5; P.inv = Math.max(P.inv, 1);
  for (const b of eB) { score += 10; spark(b.x, b.y); }
  eB.length = 0;
  for (const e of en) hit(e, e.type === 'boss' ? 40 : 15);
  boom(true); tone(200, .6, 'sine', .08, 60);
}
function movePlayer(dt){
  let ix = 0, iy = 0;
  if (keys.ArrowLeft || keys.KeyA) ix--;
  if (keys.ArrowRight || keys.KeyD) ix++;
  if (keys.ArrowUp || keys.KeyW) iy--;
  if (keys.ArrowDown || keys.KeyS) iy++;
  const m = Math.hypot(ix, iy) || 1, sp = (keys.ShiftLeft || keys.ShiftRight) ? 170 : 320;
  const px = P.x;
  P.x += ix / m * sp * dt; P.y += iy / m * sp * dt;
  if (drag) { P.x += drag.dx; P.y += drag.dy; drag.dx = drag.dy = 0; }
  P.x = clamp(P.x, 16, W - 16); P.y = clamp(P.y, 60, H - 40);
  const v = (P.x - px) / Math.max(dt, 1e-3);
  P.vx += (clamp(v / 320, -1, 1) - P.vx) * Math.min(1, dt * 10);
}

/* ---------- update ---------- */
function update(dt){
  const alive = state === 'play';
  if (alive) {
    movePlayer(dt);
    P.inv = Math.max(0, P.inv - dt);
    P.cd -= dt; if (P.cd <= 0) { fire(); P.cd = 0.11; }
  } else {
    dieT -= dt; if (dieT <= 0) { showOver(); return; }
  }

  waveT += dt;
  if (!boss) {
    spawnT -= dt;
    if (spawnT <= 0) { spawnPattern(); spawnT = Math.max(0.45, 1.45 - wave * 0.08) * rand(0.75, 1.25); }
    if (waveT >= 24) nextWave();
  }

  for (const b of pB) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const e of en) { e.t += dt; e.flash -= dt; updEnemy(e, dt); }
  for (const b of pB) {
    for (const e of en) {
      if (e.dead) continue;
      const rr = e.r + 4;
      if (d2(b, e) < rr * rr) { b.dead = true; hit(e, b.dmg); spark(b.x, b.y); break; }
    }
  }
  pB = pB.filter(b => !b.dead && b.y > -20 && b.x > -20 && b.x < W + 20);

  for (const b of eB) { b.x += b.vx * dt; b.y += b.vy * dt; }
  if (alive) {
    for (const b of eB) {
      const rr = b.r + P.r - 1;
      if (d2(b, P) < rr * rr) { b.dead = true; hurt(); break; }
    }
    for (const e of en) {
      if (e.dead) continue;
      const rr = e.r * 0.7 + 8;
      if (d2(e, P) < rr * rr) { hurt(); if (e.type !== 'boss') hit(e, 8); }
    }
  }
  eB = eB.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  en = en.filter(e => !e.dead && !e.gone);

  for (const p of picks) {
    p.t += dt;
    const dist = Math.sqrt(d2(p, P));
    if (alive && dist < 90) { p.x += (P.x - p.x) * 6 * dt; p.y += (P.y - p.y) * 6 * dt; }
    else { p.y += 75 * dt; p.x += p.vx * dt; if (p.x < 14 || p.x > W - 14) p.vx *= -1; }
    if (alive && dist < 24) { p.dead = true; collect(p); }
  }
  picks = picks.filter(p => !p.dead && p.y < H + 30);

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2.2 * dt; p.vy *= 1 - 2.2 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.t += dt; t.y -= 30 * dt; }
  texts = texts.filter(t => t.t < 0.9);
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }

  shake = Math.max(0, shake - dt * 1.6);
  flash = Math.max(0, flash - dt);
  hurtFlash = Math.max(0, hurtFlash - dt);
}
function collect(p){
  let label;
  if (p.type === 'P') { if (P.lvl < 4) { P.lvl++; label = '화력 Lv.' + P.lvl; } else { score += 1000; label = '+1,000'; } }
  else if (p.type === 'H') { if (P.hp < P.max) { P.hp++; label = '기체 수리'; } else { score += 500; label = '+500'; } }
  else { if (P.bombs < 5) { P.bombs++; label = '폭탄 +1'; } else { score += 500; label = '+500'; } }
  texts.push({x: P.x, y: P.y - 30, txt: label, t: 0, big: true});
  tone(660, .08, 'triangle', .05, 1320);
}

/* ---------- drawing ---------- */
function drawJet(x, y, tilt){
  ctx.save(); ctx.translate(x, y); ctx.scale(1 - Math.abs(tilt) * 0.22, 1);
  const f = 8 + Math.sin(time * 40) * 3;
  const g = ctx.createLinearGradient(0, 12, 0, 18 + f);
  g.addColorStop(0, '#fff3d6'); g.addColorStop(.4, C.ember); g.addColorStop(1, 'rgba(255,77,109,0)');
  ctx.fillStyle = g; poly([[-4, 12], [4, 12], [0, 18 + f]]);
  ctx.fillStyle = '#c9c0b4';
  poly([[0, -6], [21, 7], [21, 11], [0, 6], [-21, 11], [-21, 7]]);
  ctx.fillStyle = C.ivory;
  poly([[0, -24], [5, -10], [6, 10], [9, 16], [0, 14], [-9, 16], [-6, 10], [-5, -10]]);
  ctx.fillStyle = '#5fd0ff';
  ctx.beginPath(); ctx.ellipse(0, -10, 2.6, 6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = C.ember; ctx.fillRect(-20, 7, 3, 3); ctx.fillRect(17, 7, 3, 3);
  ctx.restore();
}
function drawEnemy(e){
  ctx.save(); ctx.translate(e.x, e.y);
  const hitNow = e.flash > 0;
  const body = hitNow ? '#ffffff' : C.red, dark = hitNow ? '#ffd9df' : C.redDark, glow = '#ffd08a';
  switch (e.type) {
    case 'scout':
      ctx.fillStyle = dark; poly([[0, 16], [15, -8], [6, -4], [0, -12], [-6, -4], [-15, -8]]);
      ctx.fillStyle = body; poly([[0, 13], [8, -3], [0, -8], [-8, -3]]);
      break;
    case 'gunner':
      ctx.fillStyle = dark; ctx.fillRect(-21, -4, 42, 8);
      ctx.fillStyle = body; ctx.fillRect(-14, -14, 6, 26); ctx.fillRect(8, -14, 6, 26);
      poly([[0, 18], [6, 2], [4, -12], [-4, -12], [-6, 2]]);
      ctx.fillStyle = glow; circle(0, 6, 2.5);
      break;
    case 'heavy':
      ctx.fillStyle = dark; poly([[0, 30], [36, -2], [36, -10], [8, -14], [0, -28], [-8, -14], [-36, -10], [-36, -2]]);
      ctx.fillStyle = body; poly([[0, 26], [8, -10], [0, -22], [-8, -10]]);
      ctx.fillStyle = glow; for (const x of [-26, -14, 14, 26]) circle(x, -10, 2.6);
      break;
    case 'diver':
      ctx.rotate(e.ang - Math.PI / 2);
      ctx.fillStyle = body; poly([[0, 17], [11, -12], [0, -5], [-11, -12]]);
      ctx.fillStyle = dark; poly([[0, 9], [4, -6], [-4, -6]]);
      if (e.ph === 1) { ctx.fillStyle = 'rgba(255,208,138,.7)'; poly([[-3, -8], [3, -8], [0, -20]]); }
      break;
    case 'boss': {
      ctx.fillStyle = hitNow ? '#ffe3ea' : '#2a1840';
      poly([[0, 50], [112, -8], [102, -24], [42, -20], [22, -46], [-22, -46], [-42, -20], [-102, -24], [-112, -8]]);
      ctx.fillStyle = hitNow ? '#ffffff' : '#5b3a8a';
      poly([[0, 40], [42, -6], [18, -32], [-18, -32], [-42, -6]]);
      ctx.fillStyle = body; circle(-36, 20, 7); circle(36, 20, 7);
      const pulse = 8 + Math.sin(time * 6) * 2;
      ctx.fillStyle = C.ember; circle(0, 2, pulse);
      ctx.fillStyle = '#fff3d6'; circle(0, 2, pulse * .45);
      if (Math.sin(time * 5) > 0) { ctx.fillStyle = C.alert; circle(-106, -14, 3); circle(106, -14, 3); }
      break;
    }
  }
  ctx.restore();
}
function drawPick(p){
  const col = p.type === 'P' ? C.ember : p.type === 'H' ? C.mint : C.violet;
  const bob = Math.sin(p.t * 5) * 2;
  ctx.save(); ctx.translate(p.x, p.y + bob);
  ctx.globalAlpha = 0.35; ctx.fillStyle = col; circle(0, 0, 16 + Math.sin(p.t * 8) * 2);
  ctx.globalAlpha = 1; ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(-11, -11, 22, 22, 5); ctx.fill();
  ctx.fillStyle = C.night; ctx.font = '700 14px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.type, 0, 1);
  ctx.restore();
}
function drawHud(){
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = C.steel; ctx.font = '400 11px "Noto Sans KR", sans-serif'; ctx.fillText('점수', 14, 20);
  ctx.fillStyle = C.ivory; ctx.font = '700 20px "IBM Plex Mono", monospace'; ctx.fillText(fmt(score), 14, 42);
  ctx.textAlign = 'center';
  ctx.fillStyle = C.steel; ctx.font = '400 11px "Noto Sans KR", sans-serif'; ctx.fillText('구역', W / 2, 20);
  ctx.fillStyle = C.ivory; ctx.font = '700 20px "IBM Plex Mono", monospace'; ctx.fillText(String(wave).padStart(2, '0'), W / 2, 42);

  if (boss && boss.y > 0) {
    const bw = 300, x = (W - bw) / 2, y = 56;
    ctx.fillStyle = 'rgba(20,18,43,.6)'; ctx.fillRect(x, y, bw, 8);
    ctx.fillStyle = boss.hp < boss.maxHp / 2 ? C.alert : C.ember; ctx.fillRect(x, y, bw * Math.max(0, boss.hp) / boss.maxHp, 8);
    ctx.fillStyle = C.ivory; ctx.font = '400 11px "Noto Sans KR", sans-serif'; ctx.fillText('적 기함', W / 2, y + 22);
  }

  const by = H - 18;
  ctx.textAlign = 'left';
  ctx.fillStyle = C.steel; ctx.font = '400 11px "Noto Sans KR", sans-serif'; ctx.fillText('기체', 14, by - 14);
  for (let i = 0; i < P.max; i++) {
    ctx.fillStyle = i < P.hp ? C.mint : 'rgba(169,180,214,.25)';
    ctx.beginPath(); ctx.roundRect(14 + i * 20, by - 8, 16, 8, 2); ctx.fill();
  }
  ctx.fillStyle = C.steel; ctx.fillText('폭탄', 130, by - 14);
  for (let i = 0; i < P.bombs; i++) { ctx.fillStyle = C.violet; circle(136 + i * 16, by - 4, 5); }
  ctx.textAlign = 'right';
  ctx.fillStyle = C.steel; ctx.fillText('화력', W - 14, by - 14);
  ctx.fillStyle = C.ember; ctx.font = '700 14px "IBM Plex Mono", monospace'; ctx.fillText('Lv.' + P.lvl, W - 14, by);
}
function draw(){
  ctx.save();
  if (shake > 0 && !reduceMotion) ctx.translate(rand(-1, 1) * shake * 8, rand(-1, 1) * shake * 8);
  drawBg();
  if (P && state !== 'menu') {
    ctx.fillStyle = '#d8f6ff';
    for (const b of pB) { ctx.fillRect(b.x - 1.5, b.y - 8, 3, 14); }
    for (const e of en) drawEnemy(e);
    for (const p of picks) drawPick(p);
    if (state === 'play' && !(P.inv > 0 && Math.floor(time * 20) % 2)) {
      drawJet(P.x, P.y, P.vx);
      ctx.fillStyle = C.ivory; circle(P.x, P.y, 2.2);
    }
    for (const b of eB) {
      ctx.fillStyle = C.alert; circle(b.x, b.y, b.r);
      ctx.fillStyle = '#fff'; circle(b.x, b.y, b.r * .45);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) { ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.col; circle(p.x, p.y, p.size); }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    for (const t of texts) {
      ctx.globalAlpha = 1 - t.t / 0.9;
      ctx.fillStyle = t.big ? C.mint : C.ivory;
      ctx.font = t.big ? '700 15px "Noto Sans KR", sans-serif' : '700 12px "IBM Plex Mono", monospace';
      ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    if (banner) {
      const a = Math.min(1, banner.t * 4, (banner.dur - banner.t) * 3);
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = banner.warn ? C.alert : C.ivory;
      ctx.font = '400 56px "Black Han Sans", sans-serif'; ctx.fillText(banner.text, W / 2, H * 0.4);
      ctx.fillStyle = banner.warn ? C.ivory : C.ember;
      ctx.font = '700 15px "Noto Sans KR", sans-serif'; ctx.fillText(banner.sub, W / 2, H * 0.4 + 32);
      ctx.globalAlpha = 1;
    }
    drawHud();
  }
  ctx.restore();
  if (flash > 0) { ctx.globalAlpha = flash * 1.2; ctx.fillStyle = '#fff3d6'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (hurtFlash > 0) { ctx.globalAlpha = hurtFlash; ctx.fillStyle = C.alert; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ---------- flow ---------- */
function setHud(on){ $('pauseBtn').hidden = !on; $('bombBtn').hidden = !on; }
function show(id){ for (const o of ['menu', 'pause', 'over']) $(o).hidden = o !== id; }
function start(){
  initAudio(); reset(); state = 'play'; show(null); setHud(true); cv.focus && cv.focus();
}
function pause(){ if (state !== 'play') return; state = 'pause'; show('pause'); setHud(false); drag = null; $('resumeBtn').focus(); }
function resume(){ if (state !== 'pause') return; state = 'play'; show(null); setHud(true); }
function home(){ state = 'menu'; show('menu'); setHud(false); $('bestMenu').textContent = fmt(hi); $('startBtn').focus(); }
function showOver(){
  state = 'over';
  const isBest = score > hi;
  if (isBest) { hi = score; try { localStorage.setItem('dawn-intercept-hi', String(hi)); } catch (e) {} }
  $('rScore').textContent = fmt(score); $('rWave').textContent = wave; $('rBest').textContent = fmt(hi);
  $('newBest').hidden = !isBest;
  show('over'); $('againBtn').focus();
}

$('startBtn').onclick = start;
$('againBtn').onclick = start;
$('resumeBtn').onclick = resume;
$('quitBtn').onclick = home;
$('homeBtn').onclick = home;
$('pauseBtn').onclick = pause;
$('bombBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); useBomb(); });
document.querySelectorAll('.mute').forEach(b => b.onclick = () => setMute(!muted));

addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { state === 'play' ? pause() : resume(); }
  else if (e.code === 'KeyM') setMute(!muted);
  else if (['Space', 'KeyX', 'KeyB'].includes(e.code)) useBomb();
  else if (e.code === 'Enter' && (state === 'menu' || state === 'over') && document.activeElement?.tagName !== 'BUTTON') start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  drag = {id: e.pointerId, lx: e.clientX, ly: e.clientY, dx: 0, dy: 0};
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId) return;
  const k = W / frameW * 1.25;
  drag.dx += (e.clientX - drag.lx) * k; drag.dy += (e.clientY - drag.ly) * k;
  drag.lx = e.clientX; drag.ly = e.clientY;
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  time += dt;
  if (state !== 'pause') updateBg(dt);
  if (state === 'play' || state === 'dying') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setMute(false);
})();
</script>
